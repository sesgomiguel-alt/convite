<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Aniversário</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fdfbf7;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    .card {
      max-width: 380px; width: 100%; background: #ffffff;
      border-radius: 24px; padding: 32px 24px; text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    h1 { font-size: 24px; color: #1a1a1a; margin-top: 0; margin-bottom: 8px; }
    p { font-size: 14px; color: #666; margin-bottom: 24px; line-height: 1.4; }
    .btn {
      display: block; width: 100%; padding: 16px 0; margin-bottom: 12px;
      border-radius: 14px; text-decoration: none; font-weight: bold;
      font-size: 15px; color: #ffffff; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .btn-maps { background: linear-gradient(135deg, #e65100, #ff8f00); }
    .btn-wsp { background: linear-gradient(135deg, #c2185b, #e91e63); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Aniversário Especial! 🎉</h1>
    <p>Toque nos botões abaixo para ver o local e avisos:</p>

    <!-- Substitua os links abaixo pelos seus links reais -->
    <a href="https://share.google/CSRkpdUGbwYqoOy7n" class="btn btn-maps" target="_blank">📍 VER LOCAL NO MAPA</a>
    <a href="https://drive.google.com/file/d/1rGNMCV5Glxewk_v1fDw3zbUueYf0qHkk/view?usp=sharing" class="btn btn-wsp" target="_blank">💬 INFORMAÇÕES</a>
  </div>
</body>
</html>
